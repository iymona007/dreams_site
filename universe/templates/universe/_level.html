{% if s %}
<div class="lvl{% if compact %} lvl-compact{% endif %}">
    <span class="lvl-badge">Lv {{ s.level }}</span>

    {% if not compact %}
        <b class="lvl-title">{{ s.title }}</b>
    {% endif %}
    <span class="lvl-bar">
        <i class="lvl-progress" data-progress="{{ s.progress|default:0 }}"></i>
    </span>

    <small>{{ s.xp }} XP · 🪙 {{ s.coins }}</small>
</div>
{% endif %}
